<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to CrysPlay">
    <link rel="icon" type="favicon" href="../assets/general/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Sign In | CrysPlay</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <a class="back-link" href="../index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i></a>
            <div class="brand-lockup">
                <img src="../assets/general/logo.png" class="logo" alt="CrysPlay">
            </div>
            <div class="login-heading">
                <h1 id="login-title">Sign in to continue<span>.</span></h1>
            </div>
            <form class="signin-form needs-validation" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email address</label>
                    <input id="email" name="email" type="email" class="form-control" autocomplete="email" placeholder="you@example.com" aria-describedby="email-error" required>
                    <div id="email-error" class="invalid-feedback" aria-live="polite"></div>
                </div>
                <div class="form-group">
                    <div class="password-label-row">
                        <label for="password" class="form-label">Password</label>
                        <a class="small-link">Forgot password?</a>
                    </div>
                    <div class="input-group has-validation">
                        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" placeholder="Enter your password" required>
                        <button id="toggle-password" type="button" class="btn btn-outline-secondary password-toggle">Show</button>
                        <div id="password-error" class="invalid-feedback"></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary submit-button">Sign in</button>
                <p id="login-status" role="status" class="mb-0"></p>
                <div class="divider" aria-hidden="true"><span>or continue with</span></div>
                <div class="social-actions">
                    <button type="button" class="btn social-button"><i class="bi bi-google" aria-hidden="true"></i> Google</button>
                    <button type="button" class="btn social-button"><i class="bi bi-apple" aria-hidden="true"></i> Apple</button>
                </div>
            </form>
            <p class="signup-prompt">New to CrysPlay? <a class="small-link">Create an account</a></p>
        </section>
    </main>
</body>
</html>
