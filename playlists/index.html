<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your personal video collections on CrysPlay.">
  <title>My Playlists - CrysPlay</title>
  <link rel="icon" type="image/png" href="../assets/general/favicon.png">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../assets/js/user-state.js" defer></script>
</head>
<body>
<svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
        <symbol id="icon-trending" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-10M15 5h6v6"/></symbol>
        <symbol id="icon-subscriptions" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="3"/><path d="M6 5h12M9 2h6m-5 10 5 3-5 3Z"/></symbol>
        <symbol id="icon-library" viewBox="0 0 24 24"><rect x="7" y="3" width="14" height="18" rx="2"/><path d="M3 6v12m9-10 5 4-5 4Z"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
        <symbol id="icon-messenger" viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-9 9 10 10 0 0 1-4-.9L3 21l1.4-4.7A9 9 0 1 1 21 11.5Z"/><path d="m7 13 4-4 2 3 4-3"/></symbol>
        <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
        <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.5"/></symbol>
        <symbol id="icon-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z"/></symbol>
        <symbol id="icon-shorts" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="5" transform="rotate(20 12 12)"/><path d="m10 8 6 4-6 4Z"/></symbol>
        <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
        <symbol id="icon-comment" viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-9 9 10 10 0 0 1-4-.9L3 21l1.4-4.7A9 9 0 1 1 21 11.5Z"/><path d="M8 11.5h.1m3.9 0h.1m3.9 0h.1"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></symbol>
      </defs>
    </svg>
<header class="site-header" id="top">
            <div class="header-inner container-fluid">
                <a class="brand" href="../index.html" aria-label="CrysPlay, video">
                <img src="../assets/general/logo.png" alt="CrysPlay" class="logo">
                </a>
                <form class="search-form" role="search" aria-label="Search videos" action="../index.html">
          <label class="visually-hidden" for="video-search">Search videos</label>
          <input class="form-control" id="video-search" type="search" placeholder="Find something interesting..." disabled>
          <button class="search-button" type="button" aria-label="Search videos" disabled><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg></button>
        </form>

                <nav class="main-nav" aria-label="main-nav">
                <ul class="list-unstyled mb-0">
                    <li><a href="../index.html" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg><span>Main</span></a></li>
                    <li><span class="nav-item" aria-disabled="true"><svg class="icon" aria-hidden="true"><use href="#icon-trending"/></svg><span>Trends</span></span></li>
                    <li><a class="nav-item is-current" href="index.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#icon-subscriptions"/></svg><span>My Playlists</span></a></li>
                    <li><a class="nav-item" href="../studio/index.html"><svg class="icon" aria-hidden="true"><use href="#icon-library"/></svg><span>Studio</span></a></li>
                </ul>
                </nav>

                <div class="header-actions d-flex align-items-center">
                <a class="icon-button messenger-button" href="../messenger/index.html" aria-label="Messages"><svg class="icon" aria-hidden="true"><use href="#icon-messenger"/></svg></a>
                <button class="icon-button notification-button" type="button" aria-label="Notifications" disabled><svg class="icon" aria-hidden="true"><use href="#icon-bell"/></svg><span class="notification-dot"></span></button>
                <a class="profile-avatar" href="../login/index.html" aria-label="Войти в аккаунт">А</a>
                </div>
            </div>
        </header>
  <main class="playlists-page" aria-labelledby="playlists-title">
    <div class="playlists-heading">
      <div>
        <h1 id="playlists-title">My Playlists</h1>
      </div>
      <button class="new-playlist-button" type="button" disabled aria-describedby="playlist-availability"><span aria-hidden="true">+</span> New playlist</button>
    </div>
    <section class="playlist-library" aria-labelledby="library-heading">
      <div class="library-heading">
        <h2 id="library-heading">Your playlists <span class="playlist-count">0</span></h2>
        <span class="library-total">0 videos</span>
      </div>
      <!-- Playlist cards will be populated when playlist functionality is added. -->
      <div id="playlist-list" class="playlist-list">
        <div class="playlists-empty">
          <div class="empty-playlist-icon"><svg class="icon" aria-hidden="true"><use href="#icon-subscriptions"/></svg></div>
          <h3>No playlists yet</h3>
          <p>Keep your favorites together, from new discoveries to videos worth watching again.</p>
          <p id="playlist-availability" class="playlist-availability">Playlist creation is coming soon.</p>
          <a class="discover-link" href="../index.html#discover">Explore videos <span aria-hidden="true">&rarr;</span></a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
